paths:
  image_path: "/projects/bfmz/dadams/ai-flux/containers/llm_processor.sif"

containerization:
  module_load_cmd: ""  # No module needed on Delta
  module_name: "apptainer"

limits:
  max_gpus_per_node: 8
  max_num_nodes: 178
  max_cpus_per_task: 64

allowed_values:
  qos: ["bfmz-delta-gpu"]
  partition: ["gpuA40x4", "gpuA100x4", "gpuA40x4-interactive", "gpuA100x4-interactive"]
  resource_type: ["a40", "a100"]

required_args:
  account: "VEC_INF_ACCOUNT"
  work_dir: "VEC_INF_WORK_DIR"

default_args:
  cpus_per_task: "16"
  mem_per_node: "64G"
  time: "08:00:00"
  qos: ""
  partition: "gpuA40x4-interactive"
  resource_type: ""  # Empty to avoid gres on Delta - Slurm picks GPU from partition
  exclude: ""
  nodelist: ""
  bind: ""
  venv: "apptainer"  # Use container mode
  data_type: "auto"
  log_dir: "~/.vec-inf-logs"
  model_weights_parent_dir: "/projects/bfmz/dadams/model-weights"
